<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- veios de mármore dourado para fundos claros: traços deformados por ruído, com "nuvens" suaves por baixo -->
  <defs>
    <filter id="v" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".011 .019" numOctaves="3" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b08a3a"/><stop offset=".45" stop-color="#e3c77f"/><stop offset=".7" stop-color="#c9a352"/><stop offset="1" stop-color="#a47c2c"/>
    </linearGradient>
  </defs>
  <g filter="url(#v)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#b)" stroke="#dcc9a2" opacity=".5">
      <path stroke-width="46" d="M-80 190C220 230 400 120 640 270S1010 430 1260 340 1520 390 1720 300"/>
      <path stroke-width="38" d="M-80 640C160 570 330 710 570 670S910 560 1110 710 1460 770 1720 690"/>
      <path stroke-width="26" d="M320 -40C350 130 300 270 390 410S430 630 360 780"/>
    </g>
    <g stroke="url(#g)">
      <path stroke-width="2.2" opacity=".75" d="M-80 180C200 220 380 120 620 260S1000 420 1250 330 1500 380 1720 300"/>
      <path stroke-width=".9" opacity=".6" d="M-80 196C210 240 390 142 628 280S1004 442 1254 352 1504 398 1720 322"/>
      <path stroke-width="1.2" opacity=".65" d="M620 260C700 330 760 420 900 470S1150 560 1300 520 1500 560 1720 500"/>
      <path stroke-width=".7" opacity=".5" d="M900 470C940 540 1010 580 1090 640S1180 760 1260 800"/>
      <path stroke-width="1.8" opacity=".7" d="M-80 620C150 560 320 700 560 660S900 560 1100 700 1450 760 1720 690"/>
      <path stroke-width="1" opacity=".55" d="M560 660C600 740 700 800 820 830S1000 900 1150 980"/>
      <path stroke-width=".7" opacity=".5" d="M300 -30C340 120 300 260 380 400S420 620 360 760 400 920 380 1030"/>
      <path stroke-width=".7" opacity=".45" d="M1100 -30C1060 140 1180 240 1140 420S1220 700 1180 1030"/>
      <path stroke-width=".5" opacity=".45" d="M380 400C460 420 520 380 600 430S720 520 800 500"/>
      <path stroke-width=".5" opacity=".4" d="M1250 330C1300 260 1380 240 1440 180S1560 120 1640 60"/>
      <path stroke-width=".5" opacity=".4" d="M100 600C140 520 120 440 180 380S220 280 200 230"/>
